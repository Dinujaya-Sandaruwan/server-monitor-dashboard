name: Deploy Server Dashboard

on:
  push:
    branches:
      - deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SFTP (lftp)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -e "
            set sftp:auto-confirm yes;
            open sftp://${{ secrets.SERVER_HOST }}:22;
            user ${{ secrets.SERVER_USERNAME }} ${{ secrets.SERVER_PASSWORD }};
            mirror -R \
              -X .git* \
              -X .github* \
              -X venv* \
              -X __pycache__* \
              ./ /server-monitor/;
            quit;
          "

      - name: Restart PM2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_ROOT_PASSWORD }}
          script: |
            cd /opt/server-monitor
            # Install any new dependencies
            # We use the full path to the virtualenv's pip if possible
            # But since we're root, we'll assume the environment is active or we use the local one
            /root/.pyenv/versions/3.10.12/envs/serverMonitor/bin/pip install -r requirements.txt
            pm2 restart server-dashboard

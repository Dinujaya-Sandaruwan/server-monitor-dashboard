name: Deploy Server Dashboard

on:
  push:
    branches:
      - deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SERVER_USERNAME }}
          server: ${{ secrets.SERVER_HOST }}
          password: ${{ secrets.SERVER_PASSWORD }}
          local_path: './*'
          remote_path: '/'
          delete_remote_files: false
          exclude: '.git*,.github,venv,__pycache__'

      - name: Restart PM2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root # PM2 usually needs root if started as root, or the user who started it
          password: ${{ secrets.SERVER_ROOT_PASSWORD }} # You'll need another secret for root SSH
          script: |
            cd /opt/server-monitor
            # Install any new dependencies
            pip install -r requirements.txt
            pm2 restart server-dashboard
